<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{TITLE}</title>
<meta name="description" content="{DESCRIPTION}">
<!-- SEO: 标题=搜索词, 描述=一句话答案 -->
<style>
  :root {
    --bg: #fafaf8; --text: #2c2c2a; --text-secondary: #5f5e5a;
    --blue: #185fa5; --border: #e5e5e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.8; font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }

  /* 发布时间 + 热度标签 */
  .meta { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary); }
  .hot-badge { display: inline-block; padding: 2px 10px; background: #faeeda; color: #854f0b; border-radius: 12px; font-weight: 500; font-size: 12px; }

  h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; line-height: 1.35; }
  .lead { font-size: 17px; color: var(--text-secondary); margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }

  h2 { font-size: 20px; font-weight: 600; margin: 36px 0 12px; }
  p { margin-bottom: 16px; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 要点卡片 */
  .key-point { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin: 16px 0; }
  .key-point strong { color: var(--blue); }

  /* 对比表 */
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  th { text-align: left; padding: 10px 14px; background: #f5f5f2; border-bottom: 1px solid var(--border); font-weight: 600; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); }

  /* CTA */
  .cta { margin-top: 40px; padding: 20px; background: #e6f1fb; border-radius: 10px; text-align: center; }
  .cta p { margin-bottom: 8px; font-size: 15px; }
  .cta a { font-weight: 600; }

  /* 底部 */
  .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 13px; color: #888780; text-align: center; }

  @media (max-width: 640px) {
    .container { padding: 28px 16px 60px; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="meta">
    <span>{DATE}</span>
    <span class="hot-badge">🔥 热点</span>
  </div>

  <h1>{TITLE}</h1>
  <p class="lead">{DESCRIPTION}</p>

  <!-- ===== 正文从这里开始 ===== -->
  {CONTENT}
  <!-- ===== 正文结束 ===== -->

  <div class="cta">
    <p>更多内容 → <a href="https://www.liaodingjiu.com">阿玖说事</a></p>
  </div>

  <div class="footer">
    <p>liaodingjiu.com · 热点快报 · {DATE}</p>
  </div>

</div>
</body>
</html>
